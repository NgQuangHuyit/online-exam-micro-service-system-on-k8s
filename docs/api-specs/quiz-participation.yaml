openapi: 3.0.3
info:
  title: Quiz Participation API
  version: 1.0.0

paths:
  /quiz/start:
    post:
      summary: Bắt đầu làm bài thi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: string
                quiz_id:
                  type: string
      responses:
        '200':
          description: Khởi tạo bài thi thành công, trả về câu hỏi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'

  /quiz/submit:
    post:
      summary: Nộp bài thi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: string
                quiz_id:
                  type: string
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question_id:
                        type: string
                      selected_option:
                        type: string
      responses:
        '200':
          description: Kết quả bài làm
        '400':
          description: Bài thi không hợp lệ hoặc quá hạn

components:
  schemas:
    Question:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        options:
          type: array
          items:
            type: string
