openapi: 3.0.3
info:
  title: Student Service API
  description: API quản lý thông tin sinh viên
  version: 1.0.0

paths:
  /students/{studentId}:
    get:
      summary: Lấy thông tin sinh viên
      description: Trả về thông tin chi tiết về một sinh viên
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID của sinh viên
      responses:
        '200':
          description: Thông tin sinh viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Không tìm thấy sinh viên
  
  /students/{studentId}/contact-info:
    get:
      summary: Lấy thông tin liên lạc của sinh viên
      description: Trả về thông tin liên lạc của sinh viên (email, số điện thoại)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID của sinh viên
      responses:
        '200':
          description: Thông tin liên lạc của sinh viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInfo'
        '404':
          description: Không tìm thấy sinh viên

components:
  schemas:
    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID sinh viên
        name:
          type: string
          description: Họ và tên sinh viên
        email:
          type: string
          format: email
          description: Địa chỉ email
        phoneNumber:
          type: string
          description: Số điện thoại
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo
        updatedAt:
          type: string
          format: date-time
          description: Thời điểm cập nhật gần nhất
      required:
        - id
        - name
        - email
    
    ContactInfo:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
          description: ID sinh viên
        email:
          type: string
          format: email
          description: Địa chỉ email
        phoneNumber:
          type: string
          description: Số điện thoại
      required:
        - studentId
        - email