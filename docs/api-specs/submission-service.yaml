openapi: 3.0.3
info:
  title: Submission Service API
  version: 1.0.0

paths:
  /submission/check:
    post:
      summary: Kiểm tra thời gian nộp bài thi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: string
                quiz_id:
                  type: string
      responses:
        '200':
          description: Trạng thái thời gian nộp
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_late:
                    type: boolean
                  message:
                    type: string
