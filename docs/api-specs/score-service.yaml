openapi: 3.0.0
info:
  title: Score Service API
  version: 1.0.0
  description: API cho service ghi nhận và truy xuất kết quả thi.
servers:
  - url: http://localhost:5004
    description: Local server

paths:
  /scores/{studentId}:
    get:
      summary: Lấy kết quả thi của sinh viên
      description: Lấy điểm số của sinh viên theo mã sinh viên.
      parameters:
        - name: studentId
          in: path
          required: true
          description: Mã sinh viên
          schema:
            type: string
      responses:
        '200':
          description: Thành công, trả về điểm thi của sinh viên.
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentId:
                    type: string
                  score:
                    type: number
                    format: float
                  completedAt:
                    type: string
                    format: date-time
        '404':
          description: Không tìm thấy sinh viên.
        '500':
          description: Lỗi hệ thống.

  /scores:
    post:
      summary: Ghi nhận kết quả thi của sinh viên
      description: Lưu kết quả thi của sinh viên vào hệ thống.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId:
                  type: string
                score:
                  type: number
                  format: float
                completedAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Kết quả thi đã được lưu thành công.
        '400':
          description: Thông tin yêu cầu không hợp lệ.
        '500':
          description: Lỗi hệ thống.
