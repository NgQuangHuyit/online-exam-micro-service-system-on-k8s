openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0

paths:
  /auth/login:
    post:
      summary: Xác thực thông tin sinh viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công
        '401':
          description: Thông tin đăng nhập không hợp lệ
