openapi: 3.0.3
info:
  title: Notification Service API
  description: API cho việc gửi thông báo kết quả bài thi
  version: 1.0.0

paths:
  /notifications/quiz-results:
    post:
      summary: Gửi thông báo kết quả bài thi
      description: Yêu cầu gửi thông báo kết quả bài thi đến sinh viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Yêu cầu gửi thông báo đã được chấp nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationId:
                    type: string
                    format: uuid
                  message:
                    type: string
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /notifications/{notificationId}/status:
    get:
      summary: Kiểm tra trạng thái gửi thông báo
      description: Trả về trạng thái hiện tại của thông báo
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID của thông báo
      responses:
        '200':
          description: Trạng thái thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '404':
          description: Không tìm thấy thông báo

components:
  schemas:
    NotificationRequest:
      type: object
      properties:
        examSessionId:
          type: string
          format: uuid
          description: ID phiên thi
        studentId:
          type: string
          format: uuid
          description: ID sinh viên
        quizId:
          type: string
          format: uuid
          description: ID bài thi
        score:
          type: number
          format: double
          description: Điểm số
        totalQuestions:
          type: integer
          description: Tổng số câu hỏi
        correctAnswers:
          type: integer
          description: Số câu trả lời đúng
        gradedAt:
          type: string
          format: date-time
          description: Thời điểm chấm điểm
        notificationType:
          type: string
          enum: [EMAIL, SMS]
          default: EMAIL
          description: Loại thông báo
        templateId:
          type: string
          description: ID của mẫu thông báo
        priority:
          type: string
          enum: [HIGH, NORMAL, LOW]
          default: NORMAL
          description: Mức độ ưu tiên của thông báo
      required:
        - examSessionId
        - studentId
        - quizId
        - score
        - totalQuestions
        - correctAnswers
        - gradedAt

    NotificationStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID thông báo
        studentId:
          type: string
          format: uuid
          description: ID sinh viên
        message:
          type: string
          description: Nội dung thông báo
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
          description: Trạng thái thông báo
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo
        updatedAt:
          type: string
          format: date-time
          description: Thời điểm cập nhật
      required:
        - id
        - studentId
        - message
        - status
        - createdAt