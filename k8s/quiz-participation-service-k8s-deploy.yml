apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-participation-service
  namespace: ptit-quiz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-participation-service
  template:
    metadata:
      labels:
        app: quiz-participation-service
    spec:
      containers:
        - name: quiz-participation-service
          image: ngquanghuyit/quiz-participation-service:v1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka1:19092
            - name: KAFKA_GROUP_ID
              value: quiz-participation-service
            - name: KAFKA_SUBMISSION_TOPIC
              value: quiz-submissions
            - name: QUIZ_SERVICE_URL
              value: quiz-service.ptit-quiz-app.svc.cluster.local:8080
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: password
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/quiz_participation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: redis123
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-participation-service
  namespace: ptit-quiz-app
spec:
  selector:
    app: quiz-participation-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
