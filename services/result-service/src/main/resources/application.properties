spring.application.name=result-service
server.port=8085

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=${MONGO_DATABASE:resultdb}
spring.data.mongodb.username=${MONGO_USERNAME:root}
spring.data.mongodb.password=${MONGO_PASSWORD:rootpassword}
spring.data.mongodb.authentication-database=admin

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis123}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:result-service-group}
spring.kafka.topics.submissions=${KAFKA_SUBMISSION_TOPIC:quiz-submissions}
spring.kafka.topics.notifications=${KAFKA_NOTIFICATION_TOPIC:notifications}

# Quiz Service URL
services.quiz-service.url=${QUIZ_SERVICE_URL:http://localhost:8082}

# Logging
logging.level.root=INFO
logging.level.com.ptit.soa2025=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
