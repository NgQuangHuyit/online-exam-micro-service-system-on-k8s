apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-service
  namespace: ptit-quiz-app
  labels:
    app: quiz-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-service
  template:
    metadata:
      labels:
        app: quiz-service
    spec:
      containers:
        - name: quiz-service
          image: ngquanghuyit/quiz-service:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "password"
            - name: DB_USERNAME
              value: "root"
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-service
  namespace: ptit-quiz-app
spec:
  selector:
    app: quiz-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
