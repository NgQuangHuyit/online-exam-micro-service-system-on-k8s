<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Quiz Loading...</h1>
            <div id="error" class="error hidden"></div>
            <div id="success" class="success hidden"></div>
        </header>
        
        <section class="quiz-info">
            <div class="info-card">
                <p id="description">Loading description...</p>
                <div class="info-details">
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <span id="duration">Loading...</span>
                    </div>
                </div>
                <div id="allowed" class="allowed-students hidden">
                    <i class="fas fa-users"></i>
                    <span>Allowed Students: Loading...</span>
                </div>
            </div>
        </section>
        
        <section class="quiz-action">
            <div class="student-id-input">
                <label for="studentSearch">Select your Student ID:</label>
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="studentSearch" placeholder="Search for your ID">
                </div>
                <div class="student-list-container">
                    <div id="studentList" class="student-list"></div>
                </div>
                <div class="selected-student-container">
                    <div class="selected-student-label">Selected Student ID:</div>
                    <div id="selectedStudentId" class="selected-student">None selected</div>
                </div>
                <button id="proceedButton" disabled><i class="fas fa-arrow-right"></i> Proceed</button>
                <p id="studentError" class="error hidden"></p>
            </div>
        </section>
        
        <!-- Modal for access code -->
        <div id="accessCodeModal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Enter Access Code</h2>
                <p>Please enter the access code to start the quiz</p>
                <div class="access-code-input">
                    <i class="fas fa-key"></i>
                    <input type="text" id="accessCode" placeholder="Access Code">
                </div>
                <button id="submitAccessCode"><i class="fas fa-check"></i> Submit</button>
                <p id="accessCodeError" class="error hidden"></p>
            </div>
        </div>
        
        <!-- Quiz taking interface (initially hidden) -->
        <section id="quizInterface" class="hidden">
            <div class="quiz-timer-section">
                <div class="quiz-timer">
                    <i class="fas fa-hourglass-half"></i>
                    <span id="timer">--:--:--</span>
                </div>
                <button id="submitQuiz"><i class="fas fa-paper-plane"></i> Submit Quiz</button>
            </div>
            
            <div class="questions-container" id="allQuestions">
                <!-- Questions will be added here -->
            </div>
            
            <div class="progress-container">
                <div class="progress-label">
                    <span>Quiz Progress</span>
                    <span id="progressText">0/0</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
            
            <div class="submit-section">
                <button id="submitQuizBottom" class="submit-button"><i class="fas fa-paper-plane"></i> Submit Quiz</button>
            </div>
        </section>
    </div>
</body>
</html>
