version: '3.8'
services:
  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redis123
    restart: unless-stopped
    networks:
      - quiz-network
  # MySQL
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - quiz-network

  # MongoDB
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: resultdb
    volumes:
      - mongodb-data:/data/db
#      - ./scripts/init-mongodb.js:/docker-entrypoint-initdb.d/init-mongodb.js:ro
    command: mongod --auth
    networks:
      - quiz-network

  # Kafka and Zookeeper
  zoo1:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888
    networks:
      - quiz-network
  kafka1:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - zoo1
    networks:
      - quiz-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zoo1:2181
    depends_on:
      - kafka1
      - zoo1
    networks:
      - quiz-network

  quiz-service:
    image: quiz-service:latest
    build:
      context: ./services/quiz-service
      dockerfile: Dockerfile
    hostname: quiz-service
    environment:
      DB_PASSWORD: password
      DB_USERNAME: root
      DB_URL: jdbc:mysql://mysql:3306/quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8082:8080"
    networks:
      - quiz-network
  
  quiz-participation-service:
    image: quiz-participation-service:latest
    build:
      context: ./services/quiz-participation-service
      dockerfile: Dockerfile
    container_name: quiz-participation-service
    ports:
      - "8083:8080"
    depends_on:
      - mysql
      - redis
      - kafka1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092
      KAFKA_GROUP_ID: quiz-participation-service
      KAFKA_SUBMISSION_TOPIC: quiz-submissions
      QUIZ_SERVICE_URL: quiz-service:8080
      DB_PASSWORD: password
      DB_USERNAME: root
      DB_URL: jdbc:mysql://mysql:3306/quiz_participation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
    networks:
      - quiz-network

  result-service:
    image: result-service:latest
    build:
      context: ./services/result-service
      dockerfile: Dockerfile
    container_name: result-service
    ports:
      - "8084:8080"
    depends_on:
      - redis
      - kafka1
      - mongodb
    environment:
      MONGO_DATABASE: resultdb
      MONGO_PASSWORD: rootpassword
      MONGO_USERNAME: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092
      KAFKA_SUBMISSION_TOPIC: quiz-submissions
      KAFKA_CONSUMER_GROUP: result-service-group
      KAFKA_NOTIFICATION_TOPIC: notifications
      QUIZ_SERVICE_URL: quiz-service:8080
    networks:
      - quiz-network

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:80"
    depends_on:
      - quiz-service
      - quiz-participation-service
      - result-service
    networks:
      - quiz-network
volumes:
  redis-data:
  mysql-data:
  mongodb-data:
networks:
  quiz-network:
    driver: bridge

